<style>
/* ═══════════════════════════════════════════════════════════
   QUR'AN INDEX PAGE — PREMIUM THEME
   All selectors scoped to body.qi-page
   Colors driven by CSS variables defined in /css/theme.css
   ═══════════════════════════════════════════════════════════ */

body.qi-page {
  background: var(--prem-page-bg);
  color: var(--prem-text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ── Particle canvas ──────────────────────────────────────── */
#qi-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Background gradient (dark/light from theme.css var) ──── */
body.qi-page::before {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--prem-before-bg);
  z-index: 0;
  pointer-events: none;
}

/* ── Header ───────────────────────────────────────────────── */
body.qi-page .qi-header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 32px 20px 28px;
  overflow: visible;
}

body.qi-page .qi-header::after {
  content: "";
  position: absolute;
  bottom: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--prem-gold-sep-a) 30%,
    var(--prem-gold-sep-b) 50%,
    var(--prem-gold-sep-a) 70%,
    transparent 100%
  );
}

body.qi-page .qi-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--prem-back-color);
  background: var(--prem-back-bg);
  border: 1px solid var(--prem-gold-sep-a);
  padding: 7px 16px;
  border-radius: 999px;
  position: absolute;
  left: 16px;
  top: 28px;
  text-decoration: none;
  transition: background 0.2s ease, color 0.2s ease;
  backdrop-filter: blur(6px);
}

body.qi-page .qi-back:hover {
  background: var(--prem-gold-fill);
  color: var(--prem-gold);
}

body.qi-page .qi-logo {
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
  filter: drop-shadow(0 0 14px rgba(184,134,11,0.45))
          drop-shadow(0 3px 8px rgba(0,0,0,0.5));
  animation: qi-float 6s ease-in-out infinite;
}

@keyframes qi-float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-5px); }
}

body.qi-page .qi-title {
  font-size: clamp(1.5rem, 5vw, 2rem);
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--prem-text);
  margin: 0 0 4px;
  text-shadow: 0 0 24px rgba(80,200,100,0.12);
}

body.qi-page .qi-bismillah {
  font-family: "Amiri Quran", "Amiri", serif;
  font-size: clamp(1.1rem, 3.5vw, 1.45rem);
  color: var(--prem-gold);
  line-height: 2;
  letter-spacing: 0.03em;
  text-shadow:
    0 0 18px rgba(201,162,39,0.40),
    0 2px 6px rgba(0,0,0,0.3);
  margin: 2px 0 4px;
}

/* ── Search bar ───────────────────────────────────────────── */
body.qi-page .qi-search-wrap {
  position: relative;
  z-index: 10;
  max-width: 700px;
  margin: 22px auto 0;
  padding: 0 16px;
}

body.qi-page .qi-search-wrap input {
  width: 100%;
  padding: 14px 20px 14px 48px;
  border-radius: 999px;
  border: 1px solid var(--prem-search-border);
  background: var(--prem-search-bg);
  backdrop-filter: blur(12px);
  box-shadow:
    0 4px 20px rgba(0,0,0,0.15),
    inset 0 1px 0 rgba(255,255,255,0.06);
  font-size: 0.95rem;
  font-family: "Poppins", sans-serif;
  color: var(--prem-search-color);
  outline: none;
  transition: border-color 0.22s ease, box-shadow 0.22s ease;
}

body.qi-page .qi-search-wrap input::placeholder {
  color: var(--prem-search-placeholder);
}

body.qi-page .qi-search-wrap input:focus {
  border-color: rgba(184,134,11,0.65);
  box-shadow:
    0 0 0 3px rgba(184,134,11,0.12),
    0 4px 20px rgba(0,0,0,0.15);
}

body.qi-page .qi-search-icon {
  position: absolute;
  left: 32px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  color: var(--prem-gold-dim);
  pointer-events: none;
}

/* ── Container ────────────────────────────────────────────── */
body.qi-page .qi-main {
  position: relative;
  z-index: 10;
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 16px 72px;
}

/* ── Section label ────────────────────────────────────────── */
body.qi-page .qi-section-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--prem-section-label);
  margin: 0 0 12px 4px;
}

/* ── Continue-reading banner override ─────────────────────── */
body.qi-page .continue-reading-banner {
  background: var(--prem-crb-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--prem-card-border);
  border-left: 3px solid var(--prem-crb-border-left);
  border-radius: 14px;
  box-shadow: var(--prem-card-shadow);
  margin-bottom: 20px;
}

body.qi-page .crb-label {
  color: var(--prem-gold-dim);
}

body.qi-page .crb-ref {
  color: var(--prem-card-title);
}

body.qi-page .crb-btn {
  background: var(--prem-gold-fill);
  color: var(--prem-gold);
  border: 1px solid var(--prem-gold-sep-a);
  border-radius: 8px;
  transition: background 0.2s ease;
}

body.qi-page .crb-btn:hover {
  background: var(--prem-gold-fill-lg);
}

/* ── Surah list container ─────────────────────────────────── */
body.qi-page #surahList {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── Glass surah card ─────────────────────────────────────── */
body.qi-page .surah-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 16px;
  overflow: hidden;
  border-radius: 16px;
  text-decoration: none;
  color: var(--prem-text);
  padding: 16px 20px;

  background: var(--prem-card-bg);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid var(--prem-card-border);
  box-shadow: var(--prem-card-shadow);

  transition:
    transform       0.20s cubic-bezier(0.34,1.56,0.64,1),
    box-shadow      0.20s ease,
    border-color    0.20s ease;
}

body.qi-page .surah-card:hover {
  transform: translateY(-3px) scale(1.008);
  border-color: var(--prem-card-border-hover);
  box-shadow: var(--prem-card-hover-shadow);
}

/* Gold top shimmer on hover */
body.qi-page .surah-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1.5px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--prem-gold-sep-b) 30%,
    rgba(220,170,30,0.9) 50%,
    var(--prem-gold-sep-b) 70%,
    transparent 100%
  );
  opacity: 0;
  transition: opacity 0.22s ease;
  z-index: 2;
  pointer-events: none;
}

body.qi-page .surah-card:hover::before { opacity: 1; }

/* Ripple container */
body.qi-page .surah-card .ripple-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
  z-index: 5;
}

body.qi-page .ripple-circle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(80,255,140,0.16) 0%,
    rgba(80,255,140,0.05) 50%,
    transparent 70%
  );
  transform: scale(0);
  animation: qi-ripple 0.60s cubic-bezier(0.22,1,0.36,1) forwards;
  pointer-events: none;
}

@keyframes qi-ripple {
  0%   { transform: scale(0);   opacity: 1;   }
  60%  { transform: scale(1);   opacity: 0.7; }
  100% { transform: scale(1.5); opacity: 0;   }
}

@keyframes qi-pulse-ring {
  0%   { box-shadow: 0 0 0 0    rgba(30,255,100,0.18); }
  70%  { box-shadow: 0 0 0 10px rgba(30,255,100,0);    }
  100% { box-shadow: 0 0 0 0    rgba(30,255,100,0);    }
}

body.qi-page .surah-card.pulsing {
  animation: qi-pulse-ring 0.50s ease-out;
}

/* ── Number badge ─────────────────────────────────────────── */
body.qi-page .surah-badge {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--prem-badge-bg);
  border: 1.5px solid var(--prem-gold-border);
  color: var(--prem-gold);
  font-weight: 700;
  font-size: 0.88rem;
  font-family: "Poppins", sans-serif;
  transition: border-color 0.22s ease, background 0.22s ease, transform 0.22s ease;
  position: relative;
  z-index: 1;
}

body.qi-page .surah-card:hover .surah-badge {
  border-color: var(--prem-badge-hover-border);
  background: var(--prem-badge-hover-bg);
  color: var(--prem-badge-hover-color);
  transform: scale(1.08);
}

/* ── Info block ───────────────────────────────────────────── */
body.qi-page .surah-info {
  flex: 1;
  min-width: 0;
  position: relative;
  z-index: 1;
}

body.qi-page .surah-info .name {
  font-size: 0.97rem;
  font-weight: 700;
  color: var(--prem-card-title);
  letter-spacing: 0.1px;
  margin-bottom: 2px;
  transition: color 0.2s ease;
}

body.qi-page .surah-card:hover .surah-info .name {
  color: var(--prem-text);
}

body.qi-page .surah-info .meta {
  font-size: 0.74rem;
  color: var(--prem-muted);
  margin-top: 0;
  font-weight: 400;
}

/* Arabic name (injected via JS) */
body.qi-page .surah-arabic-name {
  font-family: "Amiri", "Amiri Quran", serif;
  font-size: 1.15rem;
  color: var(--prem-gold);
  direction: rtl;
  line-height: 1.4;
  text-align: right;
  text-shadow: 0 0 10px rgba(201,162,39,0.25);
  transition: color 0.2s ease, text-shadow 0.2s ease;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

body.qi-page .surah-card:hover .surah-arabic-name {
  text-shadow: 0 0 14px rgba(201,162,39,0.40);
}

/* Arrow (injected via JS) */
body.qi-page .surah-arrow {
  font-size: 1rem;
  font-weight: 700;
  color: var(--prem-gold-dim);
  flex-shrink: 0;
  transition: transform 0.20s ease, color 0.20s ease;
  position: relative;
  z-index: 1;
}

body.qi-page .surah-card:hover .surah-arrow {
  transform: translateX(4px);
  color: var(--prem-gold);
}

/* ── Search results override ──────────────────────────────── */
body.qi-page .search-results {
  margin-bottom: 16px;
}

body.qi-page .search-section-label {
  color: var(--prem-gold-label);
  font-size: 0.70rem;
  letter-spacing: 0.12em;
}

body.qi-page .ayah-hit {
  background: var(--prem-hit-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--prem-hit-border);
  border-radius: 14px;
  box-shadow: var(--prem-card-shadow);
  color: var(--prem-text);
  transition: transform 0.18s ease, border-color 0.18s ease;
}

body.qi-page .ayah-hit:hover {
  transform: translateY(-2px);
  border-color: var(--prem-card-border-hover);
}

body.qi-page .ayah-hit-direct {
  border-color: var(--prem-gold-border);
  background: var(--prem-hit-direct-bg);
}

body.qi-page .ayah-hit-ref {
  color: var(--prem-gold-label);
}

body.qi-page .ayah-hit-arabic {
  color: var(--prem-text);
}

body.qi-page .ayah-hit-translation {
  color: var(--prem-hit-translation);
}

/* ── State message ────────────────────────────────────────── */
body.qi-page .state-msg {
  color: var(--prem-muted);
  padding: 60px 10px;
}

/* ── Divider ornament ─────────────────────────────────────── */
body.qi-page .qi-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 6px 0 16px;
  opacity: 0.38;
}

body.qi-page .qi-divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--prem-gold-sep-b), transparent);
}

body.qi-page .qi-divider-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--prem-divider-dot);
  flex-shrink: 0;
}

/* ── Footer phrase ────────────────────────────────────────── */
body.qi-page .qi-footer-phrase {
  text-align: center;
  font-family: "Amiri", serif;
  font-size: 1.05rem;
  color: var(--prem-footer-color);
  letter-spacing: 0.06em;
  padding-top: 32px;
}

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 480px) {
  body.qi-page .surah-card   { padding: 13px 14px; gap: 12px; border-radius: 13px; }
  body.qi-page .surah-badge  { width: 36px; height: 36px; font-size: 0.78rem; }
  body.qi-page .surah-info .name { font-size: 0.88rem; }
  body.qi-page .surah-arabic-name { font-size: 1rem; }
  body.qi-page .qi-back      { font-size: 0.78rem; padding: 6px 12px; top: 22px; }
}
</style>

/* ── Decorate a single .surah-card ─────────────────────────────── */
function decorateCard(card) {
  if (card.dataset.decorated) return;
  card.dataset.decorated = "1";

  /* Extract surah number from badge */
  const badge = card.querySelector(".surah-badge");
  const num   = badge ? parseInt(badge.textContent.trim(), 10) : 0;

  /* Inject Arabic name */
  const arabicName = (num >= 1 && num <= 114) ? ARABIC_NAMES[num] : "";
  if (arabicName) {
    const ar = document.createElement("div");
    ar.className = "surah-arabic-name";
    ar.textContent = arabicName;
    card.insertBefore(ar, card.querySelector(".surah-info").nextSibling);
  }

  /* Inject arrow */
  if (!card.querySelector(".surah-arrow")) {
    const arrow = document.createElement("span");
    arrow.className = "surah-arrow";
    arrow.textContent = "→";
    card.appendChild(arrow);
  }

  /* Inject ripple layer */
  if (!card.querySelector(".ripple-layer")) {
    const layer = document.createElement("div");
    layer.className = "ripple-layer";
    card.insertBefore(layer, card.firstChild);
  }

  /* Ripple + pulse on click */
  card.addEventListener("click", function (e) {
    const layer = this.querySelector(".ripple-layer");
    if (!layer) return;
    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 2.2;
    const circle = document.createElement("span");
    circle.className = "ripple-circle";
    circle.style.cssText =
      `width:${size}px;height:${size}px;` +
      `left:${e.clientX - rect.left - size/2}px;` +
      `top:${e.clientY - rect.top  - size/2}px;`;
    layer.appendChild(circle);
    this.classList.add("pulsing");
    circle.addEventListener("animationend", () => circle.remove());
    this.addEventListener("animationend",
      () => this.classList.remove("pulsing"),
      { once: true }
    );
  });
}

/* ── Watch #surahList for dynamically rendered cards ────────────── */
(function () {
  const listEl = document.getElementById("surahList");

  /* Decorate any cards already present */
  listEl.querySelectorAll(".surah-card").forEach(decorateCard);

  /* Watch for future renders (filter/search updates) */
  const obs = new MutationObserver(() => {
    listEl.querySelectorAll(".surah-card").forEach(decorateCard);
  });
  obs.observe(listEl, { childList: true, subtree: true });
})();

/* ── Particle system ────────────────────────────────────────────── */
(function () {
  const canvas = document.getElementById("qi-canvas");
  const ctx    = canvas.getContext("2d");
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  const PALETTES = [
    "rgba(80,220,120,",
    "rgba(50,180,90,",
    "rgba(200,160,30,",
    "rgba(220,190,80,",
    "rgba(140,220,160,",
    "rgba(255,255,230,"
  ];

  const COUNT = 48;
  const particles = [];
  function rand(a,b) { return a + Math.random()*(b-a); }

  for (let i = 0; i < COUNT; i++) {
    particles.push({
      x:            rand(0,1),
      y:            rand(0,1),
      r:            rand(0.8,2.2),
      vx:           rand(-0.06,0.06),
      vy:           rand(-0.09,-0.02),
      alpha:        rand(0.08,0.45),
      color:        PALETTES[Math.floor(Math.random()*PALETTES.length)],
      twinklePhase: rand(0, Math.PI*2),
      twinkleSpeed: rand(0.008,0.025),
    });
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.x += p.vx * 0.003;
      p.y += p.vy * 0.003;
      p.twinklePhase += p.twinkleSpeed;
      if (p.x < 0) p.x = 1;
      if (p.x > 1) p.x = 0;
      if (p.y < 0) p.y = 1;
      if (p.y > 1) p.y = 0;

      const tw = 0.5 + 0.5 * Math.sin(p.twinklePhase);
      const a  = p.alpha * (0.55 + 0.45 * tw);
      const px = p.x * W, py = p.y * H;

      ctx.save();
      const g = ctx.createRadialGradient(px,py,0,px,py,p.r*4);
      g.addColorStop(0, p.color + a + ")");
      g.addColorStop(1, p.color + "0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px,py,p.r*4,0,Math.PI*2); ctx.fill();

      ctx.fillStyle = p.color + Math.min(a+0.2,1)+")";
      ctx.beginPath(); ctx.arc(px,py,p.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ═══════════════════════════════════════════════════════════
   DASHBOARD-ONLY OVERRIDES — PREMIUM THEME
   All selectors scoped to body.db-page
   Colors driven by CSS variables defined in /css/theme.css
   ═══════════════════════════════════════════════════════════ */

body.db-page {
  background: var(--prem-page-bg);
  color: var(--prem-text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ── Particle canvas ──────────────────────────────────────── */
#db-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Background gradient (dark/light from theme.css var) ──── */
body.db-page::before {
  content: "";
  position: fixed;
  inset: 0;
  background: var(--prem-before-bg);
  z-index: 0;
  pointer-events: none;
}

/* ── Header ───────────────────────────────────────────────── */
body.db-page .db-header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 38px 20px 34px;
  background: transparent;
  overflow: visible;
}

body.db-page .db-header::after {
  content: "";
  position: absolute;
  bottom: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--prem-gold-sep-a) 30%,
    var(--prem-gold-sep-b) 50%,
    var(--prem-gold-sep-a) 70%,
    transparent 100%
  );
}

body.db-page .db-logo {
  display: flex;
  justify-content: center;
  margin-bottom: 14px;
  filter: drop-shadow(0 0 14px rgba(184,134,11,0.4))
          drop-shadow(0 3px 8px rgba(0,0,0,0.5));
  animation: db-logo-float 6s ease-in-out infinite;
}

@keyframes db-logo-float {
  0%, 100% { transform: translateY(0);   }
  50%       { transform: translateY(-5px); }
}

body.db-page .db-bismillah {
  font-family: "Amiri Quran", "Amiri", serif;
  font-size: clamp(1.5rem, 5vw, 2rem);
  color: var(--prem-gold);
  line-height: 1.9;
  letter-spacing: 0.03em;
  text-shadow:
    0 0 18px rgba(201,162,39,0.45),
    0 2px 6px rgba(0,0,0,0.3);
  margin-bottom: 8px;
}

body.db-page .db-welcome {
  font-size: 0.78rem;
  color: var(--prem-muted-strong);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 500;
  margin: 0;
}

/* ── Main container ───────────────────────────────────────── */
body.db-page .db-main {
  position: relative;
  z-index: 10;
  max-width: 720px;
  margin: 0 auto;
  padding: 28px 16px 64px;
}

/* ── Section label ────────────────────────────────────────── */
body.db-page .db-section-label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--prem-section-label);
  margin: 0 0 12px 4px;
}

/* ── Card grid ────────────────────────────────────────────── */
body.db-page .db-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

body.db-page .db-secondary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ── Glass card base ──────────────────────────────────────── */
body.db-page .db-card {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  text-decoration: none;
  color: var(--prem-text);
  cursor: pointer;
  display: block;

  background: var(--prem-card-bg);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border: 1px solid var(--prem-card-border);
  box-shadow: var(--prem-card-shadow);

  transition:
    transform         0.22s cubic-bezier(0.34,1.56,0.64,1),
    box-shadow        0.22s ease,
    border-color      0.22s ease;
}

body.db-page .db-card:not(.db-card-disabled):hover {
  transform: translateY(-4px) scale(1.012);
  border-color: var(--prem-card-border-hover);
  box-shadow: var(--prem-card-hover-shadow);
}

/* Gold shimmer bar at top of every card */
body.db-page .db-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--prem-gold-sep-b) 30%,
    rgba(220,170,30,0.9) 50%,
    var(--prem-gold-sep-b) 70%,
    transparent 100%
  );
  opacity: 0;
  transition: opacity 0.25s ease;
  z-index: 2;
}

body.db-page .db-card:hover::before {
  opacity: 1;
}

/* Ripple container */
body.db-page .db-card .ripple-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
  pointer-events: none;
  z-index: 5;
}

body.db-page .ripple-circle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(80,255,140,0.18) 0%,
    rgba(80,255,140,0.06) 50%,
    transparent 70%
  );
  transform: scale(0);
  animation: db-ripple 0.65s cubic-bezier(0.22,1,0.36,1) forwards;
  pointer-events: none;
}

@keyframes db-ripple {
  0%   { transform: scale(0);    opacity: 1; }
  60%  { transform: scale(1);    opacity: 0.7; }
  100% { transform: scale(1.5);  opacity: 0; }
}

@keyframes db-pulse-ring {
  0%   { box-shadow: 0 0 0 0    rgba(30,255,100,0.20); }
  70%  { box-shadow: 0 0 0 12px rgba(30,255,100,0);    }
  100% { box-shadow: 0 0 0 0    rgba(30,255,100,0);    }
}

body.db-page .db-card.pulsing {
  animation: db-pulse-ring 0.55s ease-out;
}

/* ── Featured card (Qur'on Karim) ────────────────────────── */
body.db-page .db-card-featured {
  padding: 26px 26px 24px;
  background: var(--prem-feat-bg);
  border-color: var(--prem-gold-border);
  box-shadow:
    0 6px 36px rgba(0,0,0,0.25),
    0 0 0 1px var(--prem-gold-fill),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

/* Corner ornament */
body.db-page .db-card-featured::after {
  content: "";
  position: absolute;
  top: -1px; right: -1px;
  width: 80px; height: 80px;
  background: radial-gradient(ellipse at 100% 0%,
    rgba(184,134,11,0.18) 0%,
    transparent 65%
  );
  pointer-events: none;
}

body.db-page .db-feat-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  position: relative;
  z-index: 1;
}

body.db-page .db-feat-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

body.db-page .db-feat-icon {
  font-size: 2.6rem;
  line-height: 1;
  filter:
    drop-shadow(0 0 10px rgba(184,134,11,0.5))
    drop-shadow(0 2px 6px rgba(0,0,0,0.4));
  flex-shrink: 0;
}

body.db-page .db-feat-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--prem-feat-title);
  letter-spacing: 0.4px;
  margin-bottom: 5px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

body.db-page .db-feat-desc {

  color: var(--prem-feat-desc);
  font-weight: 400;
  line-height: 1.5;
}

body.db-page .db-feat-arrow {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--prem-gold);
  flex-shrink: 0;
  text-shadow: 0 0 10px rgba(184,134,11,0.5);
  transition: transform 0.22s ease;
}

body.db-page .db-card-featured:hover .db-feat-arrow {
  transform: translateX(5px);
}

/* ── Secondary cards ──────────────────────────────────────── */
body.db-page .db-card-sec {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 26px 16px 22px;
  text-align: center;
  min-height: 128px;
}

body.db-page .db-sec-icon-wrap {
  font-size: 2rem;
  line-height: 1;
  filter: drop-shadow(0 0 8px rgba(184,134,11,0.35));
  transition: transform 0.25s ease, filter 0.25s ease;
}

body.db-page .db-card:hover .db-sec-icon-wrap {
  transform: scale(1.12) translateY(-2px);
  filter: drop-shadow(0 0 14px rgba(80,255,140,0.35));
}

body.db-page .db-sec-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--prem-card-title);
  letter-spacing: 0.2px;
}

body.db-page .db-sec-desc {
  font-size: 0.73rem;
  color: var(--prem-muted);
  line-height: 1.5;
  margin-top: -4px;
}

/* ── Disabled card ────────────────────────────────────────── */
body.db-page .db-card-disabled {

  cursor: default;
  pointer-events: none;
}

/* ── "Tez orada" badge ────────────────────────────────────── */
body.db-page .db-badge-soon {

  border: 1px solid var(--prem-soon-border);

/* ── Divider ornament between sections ────────────────────── */
body.db-page .db-divider {

body.db-page .db-divider-line {

}

body.db-page .db-divider-dot {

/* ── Footer phrase ────────────────────────────────────────── */
body.db-page .db-footer-phrase {

}
body.db-page .db-footer-signature {

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 420px) {

  body.db-page .db-sec-icon-wrap { font-size: 1.65rem; }

  body.db-page .db-feat-title    { font-size: 1.05rem; }
  body.db-page .db-feat-icon     { font-size: 2rem; }
  body.db-page .db-bismillah     { font-size: 1.4rem; }
}

<script>
/* ─── Particle system ────────────────────────────────────────────── */
(function () {
  const canvas = document.getElementById("db-canvas");
  const ctx    = canvas.getContext("2d");
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  /* Particle colours: deep greens, golds, soft whites */
  const PALETTES = [
    "rgba(80,220,120,",
    "rgba(50,180,90,",
    "rgba(200,160,30,",
    "rgba(220,190,80,",
    "rgba(140,220,160,",
    "rgba(255,255,230,"
  ];

  const PARTICLE_COUNT = 55;
  const particles = [];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function createParticle(i) {
    return {
      x:    rand(0, 1),          // 0-1 fractional
      y:    rand(0, 1),
      r:    rand(0.8, 2.2),      // radius px
      vx:   rand(-0.06, 0.06),
      vy:   rand(-0.09, -0.02),  // drift upward mostly
      alpha: rand(0.08, 0.45),
      targetAlpha: rand(0.08, 0.45),
      fadeSpeed: rand(0.002, 0.006),
      color: PALETTES[Math.floor(Math.random() * PALETTES.length)],
      twinklePhase: rand(0, Math.PI * 2),
      twinkleSpeed: rand(0.008, 0.025),
    };
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(createParticle(i));
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);

    for (const p of particles) {
      p.x += p.vx * 0.003;
      p.y += p.vy * 0.003;
      p.twinklePhase += p.twinkleSpeed;

      // twinkle
      const tw = 0.5 + 0.5 * Math.sin(p.twinklePhase);
      const a  = p.alpha * (0.55 + 0.45 * tw);

      // wrap
      if (p.x < 0)  p.x = 1;
      if (p.x > 1)  p.x = 0;
      if (p.y < 0)  p.y = 1;
      if (p.y > 1)  p.y = 0;

      const px = p.x * W;
      const py = p.y * H;

      // glow
      ctx.save();
      const g = ctx.createRadialGradient(px, py, 0, px, py, p.r * 4);
      g.addColorStop(0, p.color + a + ")");
      g.addColorStop(1, p.color + "0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, p.r * 4, 0, Math.PI * 2);
      ctx.fill();

      // core dot
      ctx.fillStyle = p.color + Math.min(a + 0.2, 1) + ")";
      ctx.beginPath();
      ctx.arc(px, py, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(tick);
  }
  tick();
})();

/* ─── Ripple + pulse on card click ──────────────────────────────── */
(function () {
  const cards = document.querySelectorAll(".db-card:not(.db-card-disabled)");

  cards.forEach(card => {
    card.addEventListener("click", function (e) {
      const layer = this.querySelector(".ripple-layer");
      if (!layer) return;

      const rect   = this.getBoundingClientRect();
      const x      = e.clientX - rect.left;
      const y      = e.clientY - rect.top;
      const size   = Math.max(rect.width, rect.height) * 2.2;

      const circle = document.createElement("span");
      circle.className = "ripple-circle";
      circle.style.cssText = `
        width:  ${size}px;
        height: ${size}px;
        left:   ${x - size / 2}px;
        top:    ${y - size / 2}px;
      `;
      layer.appendChild(circle);

      // pulse the card border
      this.classList.add("pulsing");

      // clean up
      circle.addEventListener("animationend", () => circle.remove());
      this.addEventListener("animationend", () => {
        this.classList.remove("pulsing");
      }, { once: true });
    });
  });
})();
</script>

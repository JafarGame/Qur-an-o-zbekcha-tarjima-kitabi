<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jome' at-Termiziy | QUR'AN KARIM</title>
<meta name="description" content="Jome' at-Termiziy — bob hadislari." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script src="/js/clipboard.js"></script>
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark");</script>
<style>
  .mh-chapter-card {
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 28px 24px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .mh-chapter-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-gold));
  }

  .mh-chapter-num {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-primary-dark);
    background: rgba(15,81,50,0.09);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  html.dark .mh-chapter-num {
    color: #a0d4b0;
    background: rgba(15,81,50,0.2);
  }

  .mh-chapter-arabic {
    font-family: "Amiri", serif;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    direction: rtl;
    color: var(--color-gold);
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .mh-chapter-uzbek {
    font-size: 1rem;
    font-weight: 600;
    color: var(--color-primary-dark);
    line-height: 1.5;
  }

  html.dark .mh-chapter-uzbek {
    color: #c8d4c0;
  }

  .mh-soon-block {
    background: var(--color-bg-alt);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .mh-soon-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    line-height: 1;
    opacity: 0.75;
  }

  .mh-soon-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: 8px;
  }

  .mh-soon-desc {
    font-size: 0.88rem;
    color: var(--color-muted);
    line-height: 1.65;
    max-width: 280px;
    margin: 0 auto;
  }

  .mh-breadcrumb {
    font-size: 0.78rem;
    color: rgba(253,250,240,0.7);
    margin-bottom: 2px;
  }

  /* ── Hadith cards ─────────────────────────────────────────────── */
  .hadith-list { display: flex; flex-direction: column; gap: 20px; }

  .hadith-card {
    display: block;        /* override global display:flex from style.css */
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .hadith-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--color-border);
  }

  .hadith-num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 38px;
    height: 38px;
    padding: 0 8px;
    border-radius: 999px;
    background: radial-gradient(circle, #fff8e6 0%, #f4e6bd 100%);
    border: 1.5px solid var(--color-gold);
    color: var(--color-primary-dark);
    font-weight: 700;
    font-size: 0.82rem;
    font-family: "Poppins", sans-serif;
    flex-shrink: 0;
  }

  html.dark .hadith-num-badge {
    background: radial-gradient(circle, #2a2010 0%, #1e1808 100%);
    color: var(--color-gold);
  }

  .hadith-grade-chip {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(15,81,50,0.1);
    color: var(--color-primary-dark);
  }

  html.dark .hadith-grade-chip {
    background: rgba(15,81,50,0.28);
    color: #a0d4b0;
  }

  /* Arabic text: full-width, centered, large readable font */
  .hadith-arabic-block {
    width: 100%;
    background: rgba(15,81,50,0.03);
    border-bottom: 1px solid var(--color-border);
    padding: 24px 24px 20px;
  }

  html.dark .hadith-arabic-block {
    background: rgba(255,255,255,0.025);
  }

  .hadith-arabic {
    font-family: "Amiri", serif;
    font-size: clamp(1.5rem, 5vw, 2rem);
    direction: rtl;
    text-align: center;
    color: var(--color-text);
    line-height: 2.2;
    display: block;
    width: 100%;
  }

  /* Content area: Uzbek translation + meta */
  .hadith-content { padding: 18px 20px 16px; }

  .hadith-uzbek {
    font-size: 0.95rem;
    line-height: 1.8;
    color: var(--color-text);
  }

  .hadith-meta {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--color-border);
  }

  .hadith-meta-item {
    font-size: 0.82rem;
    color: var(--color-muted);
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .hadith-meta-label {
    font-weight: 700;
    color: var(--color-primary-dark);
    white-space: nowrap;
    flex-shrink: 0;
  }

  html.dark .hadith-meta-label { color: #a0d4b0; }

  /* ── Hadith copy / share action bar ─────────────────────────── */
  .hadith-action-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px 12px;
    border-top: 1px solid var(--color-border);
  }
  .hadith-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    font-weight: 600;
    font-family: "Poppins", sans-serif;
    color: var(--color-primary-dark);
    background: rgba(15,81,50,0.07);
    border: 1px solid rgba(15,81,50,0.15);
    border-radius: 999px;
    padding: 5px 14px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hadith-action-btn:active { background: rgba(15,81,50,0.16); }
  html.dark .hadith-action-btn {
    color: #a0d4b0;
    background: rgba(15,81,50,0.2);
    border-color: rgba(160,212,176,0.2);
  }
  html.dark .hadith-action-btn:active { background: rgba(15,81,50,0.35); }
  .hadith-action-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  /* Toast notification */
  .hadith-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--color-primary-dark);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 600;
    font-family: "Poppins", sans-serif;
    padding: 10px 22px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.22);
    transition: transform 0.22s ease, opacity 0.22s ease;
    opacity: 0;
    z-index: 9999;
    pointer-events: none;
    white-space: nowrap;
  }
  .hadith-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

  <header class="site-header">
    <a class="back-link" id="backLink" href="/tirmidhi-books.html">← Boblari</a>
    <h1 id="pageTitle">Yuklanmoqda…</h1>
  </header>

  <div class="hl-info-bar" id="infoBar" hidden>
    <div>
      <div class="mh-breadcrumb" id="infoBreadcrumb"></div>
      <div class="hl-info-arabic" id="infoArabic"></div>
    </div>
    <div class="hl-info-meta">
      <span class="hl-info-chip" id="infoChip"></span>
    </div>
  </div>

  <main class="container">

    <div class="mh-chapter-card" id="chapterCard" hidden>
      <div class="mh-chapter-num" id="chapterNum"></div>
      <div class="mh-chapter-arabic" id="chapterArabic"></div>
      <div class="mh-chapter-uzbek"  id="chapterUzbek"></div>
    </div>

    <!-- Hadith list -->
    <div class="hadith-list" id="hadithList" hidden></div>

    <!-- Coming soon (shown only when no hadiths are available) -->
    <div class="mh-soon-block" id="soonBlock" hidden>
      <div class="mh-soon-icon">📖</div>
      <div class="mh-soon-title">Hadislar tez orada qo'shiladi</div>
      <div class="mh-soon-desc">
        Bu bob uchun hadislar hozirda tayyorlanmoqda. Iltimos, keyinroq qaytib keling.
      </div>
    </div>

    <div class="state-msg" id="errorMsg" hidden></div>

  </main>

  <script>
  (function () {
    const params     = new URLSearchParams(window.location.search);
    const bookNum    = parseInt(params.get("book"),    10);
    const chapterNum = parseInt(params.get("chapter"), 10);

    const backLink       = document.getElementById("backLink");
    const pageTitle      = document.getElementById("pageTitle");
    const infoBar        = document.getElementById("infoBar");
    const infoBreadcrumb = document.getElementById("infoBreadcrumb");
    const infoArabic     = document.getElementById("infoArabic");
    const infoChip       = document.getElementById("infoChip");
    const chapterCard    = document.getElementById("chapterCard");
    const chapterNumEl   = document.getElementById("chapterNum");
    const chapterArabic  = document.getElementById("chapterArabic");
    const chapterUzbek   = document.getElementById("chapterUzbek");
    const hadithList     = document.getElementById("hadithList");
    const soonBlock      = document.getElementById("soonBlock");
    const errorMsg       = document.getElementById("errorMsg");

    function showError(msg) {
      pageTitle.textContent = "Xatolik";
      errorMsg.textContent  = msg;
      errorMsg.hidden = false;
    }

    var _hadithMap = {};
    function renderCard(h) {
      var key = String(h.number);
      _hadithMap[key] = h;
      const grade = h.grade ? `<span class="hadith-grade-chip">${h.grade}</span>` : '';
      const arabicBlock = h.arabic
        ? `<div class="hadith-arabic-block"><div class="hadith-arabic">${h.arabic}</div></div>` : '';
      const uzbek = h.uzbek ? `<div class="hadith-uzbek">${h.uzbek}</div>` : '';
      const nar   = h.narrator ? `<div class="hadith-meta-item"><span class="hadith-meta-label">Rivoyatchi:</span> ${h.narrator}</div>` : '';
      const src   = h.source  ? `<div class="hadith-meta-item"><span class="hadith-meta-label">Manba:</span> ${h.source}</div>` : '';
      const meta  = (nar || src) ? `<div class="hadith-meta">${nar}${src}</div>` : '';
      const content = (uzbek || meta) ? `<div class="hadith-content">${uzbek}${meta}</div>` : '';
      const actions = `<div class="hadith-action-bar">
        <button class="hadith-action-btn" data-hid="${key}" data-action="copy" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="9" height="11" rx="1.5"/><path d="M3 12H2a1 1 0 01-1-1V2a1 1 0 011-1h8a1 1 0 011 1v1"/></svg>
          Nusxa
        </button>
        <button class="hadith-action-btn" data-hid="${key}" data-action="share" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="3" r="1.8"/><circle cx="3" cy="8" r="1.8"/><circle cx="13" cy="13" r="1.8"/><path d="M4.8 9l6.4 3M11.2 4L4.8 7"/></svg>
          Ulashish
        </button>
      </div>`;
      return `<div class="hadith-card">
        <div class="hadith-header"><span class="hadith-num-badge">${h.number}</span>${grade}</div>
        ${arabicBlock}${content}${actions}
      </div>`;
    }

    if (!bookNum || !chapterNum) { showError("Bob topilmadi."); return; }

    backLink.href = "/tirmidhi-chapters.html?book=" + bookNum;

    Promise.all([
      fetch("/data/hadith/tirmidhi-books.json").then(r => { if (!r.ok) throw new Error(); return r.json(); }),
      fetch("/data/hadith/tirmidhi-chapters.json").then(r => { if (!r.ok) throw new Error(); return r.json(); }),
      fetch("/data/hadith/tirmidhi.json").then(r => { if (!r.ok) throw new Error(); return r.json(); })
    ])
    .then(([books, allChapters, allHadiths]) => {
      const book = books.find(b => b.book_number === bookNum);
      if (!book) { showError("Bunday kitob mavjud emas."); return; }

      const chapter = allChapters.find(
        ch => ch.book_id === bookNum && ch.chapter_number === chapterNum
      );
      if (!chapter) { showError("Bunday bob mavjud emas."); return; }

      document.title        = chapter.uzbek_title + " | Jome' at-Termiziy";
      pageTitle.textContent = bookNum + "-kitob, " + chapterNum + "-bob";

      infoBreadcrumb.textContent = book.uzbek_title + " · " + bookNum + "-kitob";
      infoArabic.textContent     = chapter.arabic_title;
      infoChip.textContent       = chapterNum + "-bob";
      infoBar.hidden = false;

      chapterNumEl.textContent  = chapterNum + "-bob";
      chapterArabic.textContent = chapter.arabic_title;
      chapterUzbek.textContent  = chapter.uzbek_title;
      chapterCard.hidden = false;

      const hadiths = allHadiths.filter(
        h => h.book === bookNum && h.chapter === chapterNum
      );
      if (hadiths.length > 0) {
        hadithList.innerHTML = hadiths.map(renderCard).join('');
        hadithList.hidden = false;
        soonBlock.hidden  = true;
      } else {
        soonBlock.hidden = false;
      }
    })
    .catch(() => {
      showError("Ma'lumotlarni yuklashda xatolik yuz berdi.");
    });

    // ── Copy / Share ──────────────────────────────────────────────
    var _toastTimer;
    function showHadithToast(msg) {
      var t = document.getElementById('hadithToast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
    }
    function buildShareText(h) {
      var parts = [];
      if (h.arabic) parts.push(h.arabic);
      if (h.uzbek)  { parts.push(''); parts.push(h.uzbek); }
      var meta = [];
      if (h.narrator) meta.push('Rivoyatchi: ' + h.narrator);
      if (h.source)   meta.push('Manba: '      + h.source);
      if (meta.length) { parts.push(''); parts.push(meta.join('\n')); }
      return parts.join('\n');
    }
    hadithList.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var h = _hadithMap[btn.dataset.hid];
      if (!h) return;
      var text = buildShareText(h);
      if (btn.dataset.action === 'copy') {
        ClipboardUtils.copy(text).then(function() { showHadithToast('Nusxa olindi ✓'); });
      } else {
        ClipboardUtils.share({ title: 'Hadis', text: text }, function() { showHadithToast('Nusxa olindi ✓'); });
      }
    });
  })();
  </script>

  <div class="hadith-toast" id="hadithToast"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sahih Muslim | QUR'AN KARIM</title>
<meta name="description" content="Sahih Muslim — bob hadislari." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark");</script>
<style>
  /* Chapter header card */
  .mh-chapter-card {
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 28px 24px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .mh-chapter-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-gold));
  }

  .mh-chapter-num {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--color-primary-dark);
    background: rgba(15,81,50,0.09);
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  html.dark .mh-chapter-num {
    color: #a0d4b0;
    background: rgba(15,81,50,0.2);
  }

  .mh-chapter-arabic {
    font-family: "Amiri", serif;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    direction: rtl;
    color: var(--color-gold);
    line-height: 1.6;
    margin-bottom: 10px;
  }

  .mh-chapter-uzbek {
    font-size: 1rem;
    font-weight: 600;
    color: var(--color-primary-dark);
    line-height: 1.5;
  }

  html.dark .mh-chapter-uzbek {
    color: #c8d4c0;
  }

  /* Coming soon block */
  .mh-soon-block {
    background: var(--color-bg-alt);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .mh-soon-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    line-height: 1;
    opacity: 0.75;
  }

  .mh-soon-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: 8px;
  }

  .mh-soon-desc {
    font-size: 0.88rem;
    color: var(--color-muted);
    line-height: 1.65;
    max-width: 280px;
    margin: 0 auto;
  }

  /* Breadcrumb in info bar */
  .mh-breadcrumb {
    font-size: 0.78rem;
    color: rgba(253,250,240,0.7);
    margin-bottom: 2px;
  }

  /* ── Hadith cards ─────────────────────────────────────────────── */
  .hadith-list { display: flex; flex-direction: column; gap: 16px; }

  .hadith-card {
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 22px 20px 18px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .hadith-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--color-primary), var(--color-gold));
  }

  .hadith-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }

  .hadith-num-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle, #fff8e6 0%, #f4e6bd 100%);
    border: 1.5px solid var(--color-gold);
    color: var(--color-primary-dark); font-weight: 700;
    font-size: 0.78rem; font-family: "Poppins", sans-serif; flex-shrink: 0;
  }

  html.dark .hadith-num-badge { background: radial-gradient(circle, #2a2010 0%, #1e1808 100%); color: var(--color-gold); }

  .hadith-grade-chip {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 3px 10px; border-radius: 999px;
    background: rgba(15,81,50,0.1); color: var(--color-primary-dark);
  }

  html.dark .hadith-grade-chip { background: rgba(15,81,50,0.25); color: #a0d4b0; }

  .hadith-arabic {
    font-family: "Amiri", serif; font-size: clamp(1.15rem, 3.5vw, 1.45rem);
    direction: rtl; text-align: right; color: var(--color-text);
    line-height: 2; margin-bottom: 14px; padding-bottom: 14px;
    border-bottom: 1px solid var(--color-border);
  }

  .hadith-uzbek { font-size: 0.93rem; line-height: 1.75; color: var(--color-text); margin-bottom: 16px; }

  .hadith-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-top: 12px; border-top: 1px solid var(--color-border); }

  .hadith-meta-item { font-size: 0.78rem; color: var(--color-muted); display: flex; align-items: center; gap: 5px; }

  .hadith-meta-label { font-weight: 600; color: var(--color-primary-dark); }

  html.dark .hadith-meta-label { color: #a0d4b0; }
</style>
</head>
<body>

  <header class="site-header">
    <a class="back-link" id="backLink" href="/muslim-books.html">← Boblari</a>
    <h1 id="pageTitle">Yuklanmoqda…</h1>
  </header>

  <!-- Book info bar -->
  <div class="hl-info-bar" id="infoBar" hidden>
    <div>
      <div class="mh-breadcrumb" id="infoBreadcrumb"></div>
      <div class="hl-info-arabic" id="infoArabic"></div>
    </div>
    <div class="hl-info-meta">
      <span class="hl-info-chip" id="infoChip"></span>
    </div>
  </div>

  <main class="container">

    <!-- Chapter header -->
    <div class="mh-chapter-card" id="chapterCard" hidden>
      <div class="mh-chapter-num" id="chapterNum"></div>
      <div class="mh-chapter-arabic" id="chapterArabic"></div>
      <div class="mh-chapter-uzbek"  id="chapterUzbek"></div>
    </div>

    <!-- Hadith list -->
    <div class="hadith-list" id="hadithList" hidden></div>

    <!-- Coming soon (shown only when no hadiths are available) -->
    <div class="mh-soon-block" id="soonBlock" hidden>
      <div class="mh-soon-icon">📖</div>
      <div class="mh-soon-title">Hadislar tez orada qo'shiladi</div>
      <div class="mh-soon-desc">
        Bu bob uchun hadislar hozirda tayyorlanmoqda. Iltimos, keyinroq qaytib keling.
      </div>
    </div>

    <div class="state-msg" id="errorMsg" hidden></div>

  </main>

  <script>
  (function () {
    const params     = new URLSearchParams(window.location.search);
    const bookNum    = parseInt(params.get("book"),    10);
    const chapterNum = parseInt(params.get("chapter"), 10);

    const backLink       = document.getElementById("backLink");
    const pageTitle      = document.getElementById("pageTitle");
    const infoBar        = document.getElementById("infoBar");
    const infoBreadcrumb = document.getElementById("infoBreadcrumb");
    const infoArabic     = document.getElementById("infoArabic");
    const infoChip       = document.getElementById("infoChip");
    const chapterCard    = document.getElementById("chapterCard");
    const chapterNumEl   = document.getElementById("chapterNum");
    const chapterArabic  = document.getElementById("chapterArabic");
    const chapterUzbek   = document.getElementById("chapterUzbek");
    const hadithList     = document.getElementById("hadithList");
    const soonBlock      = document.getElementById("soonBlock");
    const errorMsg       = document.getElementById("errorMsg");

    function showError(msg) {
      pageTitle.textContent = "Xatolik";
      errorMsg.textContent  = msg;
      errorMsg.hidden = false;
    }

    function renderCard(h) {
      const grade  = h.grade   ? `<span class="hadith-grade-chip">${h.grade}</span>` : '';
      const arabic = h.arabic  ? `<div class="hadith-arabic">${h.arabic}</div>` : '';
      const uzbek  = h.uzbek   ? `<div class="hadith-uzbek">${h.uzbek}</div>` : '';
      const nar    = h.narrator ? `<div class="hadith-meta-item"><span class="hadith-meta-label">Rivoyatchi:</span> ${h.narrator}</div>` : '';
      const src    = h.source  ? `<div class="hadith-meta-item"><span class="hadith-meta-label">Manba:</span> ${h.source}</div>` : '';
      const meta   = (nar || src) ? `<div class="hadith-meta">${nar}${src}</div>` : '';
      return `<div class="hadith-card">
        <div class="hadith-header"><span class="hadith-num-badge">${h.number}</span>${grade}</div>
        ${arabic}${uzbek}${meta}
      </div>`;
    }

    if (!bookNum || !chapterNum) { showError("Bob topilmadi."); return; }

    backLink.href = "/muslim-chapters.html?book=" + bookNum;

    Promise.all([
      fetch("/data/hadith/muslim-books.json").then(r => { if (!r.ok) throw new Error(); return r.json(); }),
      fetch("/data/hadith/muslim-chapters.json").then(r => { if (!r.ok) throw new Error(); return r.json(); }),
      fetch("/data/hadith/muslim.json").then(r => { if (!r.ok) throw new Error(); return r.json(); })
    ])
    .then(([books, allChapters, allHadiths]) => {
      const book = books.find(b => b.book_number === bookNum);
      if (!book) { showError("Bunday kitob mavjud emas."); return; }

      const chapter = allChapters.find(
        ch => ch.book_id === bookNum && ch.chapter_number === chapterNum
      );
      if (!chapter) { showError("Bunday bob mavjud emas."); return; }

      document.title        = chapter.uzbek_title + " | Sahih Muslim";
      pageTitle.textContent = bookNum + "-kitob, " + chapterNum + "-bob";

      infoBreadcrumb.textContent = book.uzbek_title + " · " + bookNum + "-kitob";
      infoArabic.textContent     = chapter.arabic_title;
      infoChip.textContent       = chapterNum + "-bob";
      infoBar.hidden = false;

      chapterNumEl.textContent  = chapterNum + "-bob";
      chapterArabic.textContent = chapter.arabic_title;
      chapterUzbek.textContent  = chapter.uzbek_title;
      chapterCard.hidden = false;

      const hadiths = allHadiths.filter(
        h => h.book === bookNum && h.chapter === chapterNum
      );
      if (hadiths.length > 0) {
        hadithList.innerHTML = hadiths.map(renderCard).join('');
        hadithList.hidden = false;
        soonBlock.hidden  = true;
      } else {
        soonBlock.hidden = false;
      }
    })
    .catch(() => {
      showError("Ma'lumotlarni yuklashda xatolik yuz berdi.");
    });
  })();
  </script>

</body>
</html>

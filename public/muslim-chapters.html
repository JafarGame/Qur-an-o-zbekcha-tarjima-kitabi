<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sahih Muslim | QUR'AN KARIM</title>
<meta name="description" content="Sahih Muslim — kitob boblari." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark");</script>
<style>
  .ch-count {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--color-muted);
    margin-bottom: 14px;
  }

  .ch-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ch-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--color-bg-alt);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: var(--color-text);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    cursor: pointer;
  }

  .ch-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(15,81,50,0.13);
    border-color: rgba(15,81,50,0.3);
  }

  .ch-card:hover .ch-card-arrow {
    transform: translateX(4px);
  }

  .ch-num-badge {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8e6 0%, #f4e6bd 100%);
    border: 1.5px solid var(--color-gold);
    color: var(--color-primary-dark);
    font-weight: 700;
    font-size: 0.82rem;
    font-family: "Poppins", sans-serif;
  }

  html.dark .ch-num-badge {
    background: radial-gradient(circle, #2a2010 0%, #1e1808 100%);
    color: var(--color-gold);
  }

  .ch-card-body {
    flex: 1;
    min-width: 0;
  }

  .ch-card-arabic {
    font-family: "Amiri", serif;
    font-size: 1.1rem;
    direction: rtl;
    color: var(--color-gold);
    line-height: 1.5;
    margin-bottom: 3px;
  }

  .ch-card-title {
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--color-primary-dark);
    line-height: 1.45;
  }

  html.dark .ch-card-title {
    color: #c8d4c0;
  }

  .ch-card-arrow {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--color-gold);
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }

  /* Empty chapters placeholder */
  .ch-soon-block {
    background: var(--color-bg-alt);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    box-shadow: var(--shadow);
    margin-top: 8px;
  }

  .ch-soon-icon {
    font-size: 2.8rem;
    margin-bottom: 14px;
    line-height: 1;
    opacity: 0.7;
  }

  .ch-soon-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: 8px;
  }

  .ch-soon-desc {
    font-size: 0.86rem;
    color: var(--color-muted);
    line-height: 1.65;
    max-width: 300px;
    margin: 0 auto;
  }
</style>
</head>
<body>

  <header class="site-header">
    <a class="back-link" href="/muslim-books.html">← Kitoblar</a>
    <h1 id="pageTitle">Yuklanmoqda…</h1>
  </header>

  <!-- Book info bar -->
  <div class="hl-info-bar" id="infoBar" hidden>
    <div class="hl-info-arabic" id="infoArabic"></div>
    <div class="hl-info-meta">
      <span class="hl-info-chip" id="infoBookNum"></span>
    </div>
  </div>

  <main class="container">
    <div class="ch-count" id="chCount"></div>
    <div class="ch-list"  id="chapterList"></div>
  </main>

  <script>
  (function () {
    const params      = new URLSearchParams(window.location.search);
    const bookNum     = parseInt(params.get("book"), 10);
    const pageTitle   = document.getElementById("pageTitle");
    const infoBar     = document.getElementById("infoBar");
    const infoArabic  = document.getElementById("infoArabic");
    const infoBookNum = document.getElementById("infoBookNum");
    const chCount     = document.getElementById("chCount");
    const chapterList = document.getElementById("chapterList");

    if (!bookNum) {
      pageTitle.textContent = "Topilmadi";
      chapterList.innerHTML = '<div class="state-msg">Kitob raqami ko\'rsatilmagan.</div>';
      return;
    }

    // Fetch book metadata and chapter list in parallel
    Promise.all([
      fetch("/data/hadith/muslim-books.json").then(r => { if (!r.ok) throw new Error(); return r.json(); }),
      fetch("/data/hadith/muslim-chapters.json").then(r => { if (!r.ok) throw new Error(); return r.json(); })
    ])
    .then(([books, allChapters]) => {
      // Book metadata
      const book = books.find(b => b.book_number === bookNum);
      if (!book) {
        pageTitle.textContent = "Topilmadi";
        chapterList.innerHTML = '<div class="state-msg">Bunday kitob mavjud emas.</div>';
        return;
      }

      document.title        = book.uzbek_title + " — Boblari | Sahih Muslim";
      pageTitle.textContent = book.uzbek_title;
      infoArabic.textContent  = book.arabic_title;
      infoBookNum.textContent = bookNum + "-kitob";
      infoBar.hidden = false;

      // Filter chapters for this book
      const chapters = allChapters
        .filter(ch => ch.book_id === bookNum)
        .sort((a, b) => a.chapter_number - b.chapter_number);

      if (!chapters.length) {
        chapterList.innerHTML = `
          <div class="ch-soon-block">
            <div class="ch-soon-icon">📖</div>
            <div class="ch-soon-title">Boblar tez orada qo'shiladi</div>
            <div class="ch-soon-desc">
              Bu kitob uchun boblar hozirda tayyorlanmoqda. Iltimos, keyinroq qaytib keling.
            </div>
          </div>`;
        return;
      }

      chCount.textContent = chapters.length + " ta bob";

      chapterList.innerHTML = chapters.map(ch => `
        <a class="ch-card"
           href="/muslim-hadith.html?book=${bookNum}&chapter=${ch.chapter_number}">
          <div class="ch-num-badge">${ch.chapter_number}</div>
          <div class="ch-card-body">
            <div class="ch-card-arabic">${ch.arabic_title || ""}</div>
            <div class="ch-card-title">${ch.uzbek_title || ""}</div>
          </div>
          <span class="ch-card-arrow">→</span>
        </a>
      `).join("");
    })
    .catch(() => {
      pageTitle.textContent = "Xatolik";
      chapterList.innerHTML = '<div class="state-msg">Ma\'lumotlarni yuklashda xatolik yuz berdi.</div>';
    });
  })();
  </script>

</body>
</html>

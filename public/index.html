<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qur'on | Suralar ro'yxati</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 54" width="64" height="54">
        <!-- Left page (parchment) -->
        <path d="M3 13 L29 9 L29 47 L3 43 Z" fill="#fef5d4"/>
        <!-- Right page (parchment) -->
        <path d="M35 9 L61 13 L61 43 L35 47 Z" fill="#fef5d4"/>
        <!-- Gold spine -->
        <path d="M29 7.5 Q32 6.5 35 7.5 L35 48.5 Q32 49.5 29 48.5 Z" fill="url(#spineGrad)"/>
        <!-- Spine centre highlight -->
        <line x1="32" y1="8" x2="32" y2="48" stroke="rgba(255,248,180,0.45)" stroke-width="1"/>
        <!-- Left page lines (suggest Arabic text, RTL feel — shorter on left) -->
        <line x1="9"  y1="18"   x2="25" y2="18.6" stroke="#c4924a" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="9"  y1="23.5" x2="25" y2="24.1" stroke="#c4924a" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="9"  y1="29"   x2="25" y2="29.6" stroke="#c4924a" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="9"  y1="34.5" x2="25" y2="35"   stroke="#c4924a" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="14" y1="40"   x2="25" y2="40.4" stroke="#c4924a" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
        <!-- Right page lines (mirror) -->
        <line x1="39" y1="18.6" x2="55" y2="18"   stroke="#c4924a" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="39" y1="24.1" x2="55" y2="23.5" stroke="#c4924a" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="39" y1="29.6" x2="55" y2="29"   stroke="#c4924a" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="39" y1="35"   x2="55" y2="34.5" stroke="#c4924a" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="39" y1="40.4" x2="50" y2="40"   stroke="#c4924a" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
        <!-- Book cover bottom edge (depth) -->
        <path d="M3 43 L29 47 L35 47 L61 43 L61 45.5 L35 49.5 L29 49.5 L3 45.5 Z" fill="rgba(0,0,0,0.18)"/>
        <!-- Gold diamond ornament at top of spine -->
        <path d="M32 2 L34.2 5.5 L32 7.2 L29.8 5.5 Z" fill="#e2b24a"/>
        <defs>
          <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#b8860b"/>
            <stop offset="45%"  stop-color="#d4a820"/>
            <stop offset="100%" stop-color="#b8860b"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h1>QUR'AN KARIM</h1>
    <p>Arab matni va o'zbekcha tarjimasi</p>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Qidiruv: 3:25, Baqara 255, yoki matn..." autocomplete="off" />
  </div>

  <main class="container">
    <div id="searchResults" class="search-results"></div>
    <div id="surahList" class="surah-list">
      <div class="state-msg">Yuklanmoqda...</div>
    </div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>

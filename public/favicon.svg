<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Green rounded background -->
  <rect width="32" height="32" rx="6" fill="#0f5132"/>
  <!-- Left page (cream/parchment) -->
  <path d="M3 9 L14 7 L14 25 L3 23 Z" fill="#fef5d4"/>
  <!-- Right page (cream/parchment) -->
  <path d="M18 7 L29 9 L29 23 L18 25 Z" fill="#fef5d4"/>
  <!-- Gold spine -->
  <path d="M14 6 Q16 5.2 18 6 L18 26 Q16 26.8 14 26 Z" fill="#c9910e"/>
  <!-- Spine highlight -->
  <line x1="16" y1="6.5" x2="16" y2="25.5" stroke="rgba(255,245,160,0.45)" stroke-width="0.8"/>
  <!-- Left page text lines -->
  <line x1="5" y1="11.5" x2="12" y2="11.8" stroke="#c9a84c" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="5" y1="14.2" x2="12" y2="14.5" stroke="#c9a84c" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="5" y1="17"   x2="12" y2="17.3" stroke="#c9a84c" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="5" y1="19.8" x2="12" y2="20"   stroke="#c9a84c" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Right page text lines (mirror) -->
  <line x1="20" y1="11.8" x2="27" y2="11.5" stroke="#c9a84c" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20" y1="14.5" x2="27" y2="14.2" stroke="#c9a84c" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20" y1="17.3" x2="27" y2="17"   stroke="#c9a84c" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20" y1="20"   x2="27" y2="19.8" stroke="#c9a84c" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Small gold diamond at top of spine -->
  <path d="M16 3 L17.3 5 L16 5.8 L14.7 5 Z" fill="#e2b24a"/>
</svg>

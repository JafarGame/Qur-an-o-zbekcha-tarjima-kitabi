<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QUR'AN KARIM | Arab matni va o'zbekcha tarjimasi</title>
<meta name="description" content="Qur'on Karim — arabcha Qur'on matni va o'zbekcha tarjimasi bilan o'qish platformasi." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark");</script>

<style>
/* ════════════════════════════════════════════════════════════
   FIXED BOTTOM AYAH NAVIGATION BAR
   Always visible on mobile (≤ 639 px), hidden on desktop.
   Self-contained: own JS handles navigation independently.
   ════════════════════════════════════════════════════════════ */

/* ── Body padding so last ayah isn't hidden behind the bar ── */
body { padding-bottom: 80px; }

/* ── The bar ── */
#ayah-bottom-nav {
  /* Layout */
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));

  /* Glass — dark green */
  background: rgba(3, 14, 8, 0.85);
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);

  /* Gold border top */
  border-top: 1.5px solid rgba(201, 162, 39, 0.55);

  /* Shadow */
  box-shadow:
    0 -4px 32px rgba(0, 0, 0, 0.60),
    0 -1px 0   rgba(201, 162, 39, 0.20),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

/* Light mode overrides */
html:not(.dark) #ayah-bottom-nav {
  background: rgba(240, 235, 220, 0.90);
  border-top: 1.5px solid rgba(184, 134, 11, 0.40);
  box-shadow:
    0 -4px 24px rgba(0, 0, 0, 0.12),
    0 -1px 0   rgba(184, 134, 11, 0.20);
}

/* ── Nav buttons ── */
#ayah-bottom-nav .abn-btn {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  gap: 6px;

  padding: 9px 16px;
  border-radius: 10px;
  border: 1px solid rgba(201, 162, 39, 0.45);
  background: rgba(8, 30, 15, 0.70);
  color: rgba(220, 240, 215, 0.92);

  font-family: inherit;
  font-size: 0.80rem;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;

  transition:
    background     0.18s ease,
    border-color   0.18s ease,
    color          0.18s ease,
    transform      0.12s ease,
    box-shadow     0.18s ease;
}

html:not(.dark) #ayah-bottom-nav .abn-btn {
  background: rgba(255, 255, 255, 0.72);
  border-color: rgba(184, 134, 11, 0.38);
  color: rgba(20, 50, 20, 0.88);
}

#ayah-bottom-nav .abn-btn:hover:not(:disabled) {
  background: rgba(30, 255, 100, 0.10);
  border-color: rgba(80, 255, 140, 0.65);
  color: #8cffa0;
  box-shadow: 0 0 14px rgba(30, 255, 100, 0.18);
}

html:not(.dark) #ayah-bottom-nav .abn-btn:hover:not(:disabled) {
  background: rgba(0, 120, 50, 0.10);
  border-color: rgba(0, 160, 70, 0.50);
  color: #0a5e22;
  box-shadow: 0 0 10px rgba(0, 140, 60, 0.10);
}

#ayah-bottom-nav .abn-btn:active:not(:disabled) {
  transform: scale(0.93);
  background: rgba(30, 255, 100, 0.16);
}

html:not(.dark) #ayah-bottom-nav .abn-btn:active:not(:disabled) {
  background: rgba(0, 120, 50, 0.16);
}

#ayah-bottom-nav .abn-btn:disabled {
  opacity: 0.28;
  cursor: not-allowed;
}

/* SVG arrow icons */
#ayah-bottom-nav .abn-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  flex-shrink: 0;
  transition: transform 0.15s ease;
}
#ayah-bottom-nav .abn-btn--prev:hover:not(:disabled) svg { transform: translateX(-2px); }
#ayah-bottom-nav .abn-btn--next:hover:not(:disabled) svg { transform: translateX( 2px); }

/* ── Ayah counter pill ── */
#ayah-bottom-nav .abn-counter {
  flex: 1;
  text-align: center;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 700;
  color: #c9a227;
  letter-spacing: 0.06em;
  white-space: nowrap;
  pointer-events: none;
  text-shadow: 0 0 12px rgba(201, 162, 39, 0.35);
}

html:not(.dark) #ayah-bottom-nav .abn-counter {
  color: #8a6800;
  text-shadow: none;
}

/* ── Ripple animation ── */
.abn-ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(80, 255, 140, 0.40);
  transform: scale(0);
  animation: abn-ripple-anim 0.50s ease-out forwards;
  pointer-events: none;
}

html:not(.dark) .abn-ripple {
  background: rgba(0, 160, 70, 0.30);
}

@keyframes abn-ripple-anim {
  to { transform: scale(5); opacity: 0; }
}

/* ════════════════════════════════════════════════════════════
   SURAH NAVIGATION — under the surah title block
   ════════════════════════════════════════════════════════════ */
.surah-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(184, 134, 11, 0.18);
}

.sn-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid rgba(184, 134, 11, 0.38);
  background: rgba(8, 30, 15, 0.55);
  color: rgba(210, 235, 210, 0.85);
  font-family: inherit;
  font-size: 0.76rem;
  font-weight: 600;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition:
    background  0.16s ease,
    border-color 0.16s ease,
    color        0.16s ease,
    box-shadow   0.16s ease,
    transform    0.10s ease;
}

html:not(.dark) .sn-btn {
  background: rgba(255, 255, 255, 0.65);
  border-color: rgba(184, 134, 11, 0.32);
  color: rgba(20, 50, 20, 0.85);
}

.sn-btn:hover {
  background: rgba(30, 255, 100, 0.09);
  border-color: rgba(80, 255, 140, 0.55);
  color: #8cffa0;
  box-shadow: 0 0 10px rgba(30, 255, 100, 0.12);
}

html:not(.dark) .sn-btn:hover {
  background: rgba(0, 120, 50, 0.09);
  border-color: rgba(0, 160, 70, 0.42);
  color: #0a5e22;
  box-shadow: 0 0 8px rgba(0, 140, 60, 0.10);
}

.sn-btn:active {
  transform: scale(0.95);
}

.sn-btn.disabled {
  opacity: 0.28;
  pointer-events: none;
}
</style>
</head>
<body>

  <header class="site-header">
    <a class="back-link" href="/">← Suralar</a>
    <h1 id="headerTitle">Yuklanmoqda...</h1>
  </header>

  <main class="container">

    <!-- ── Top reading controls ── -->
    <div class="reading-controls">

      <div class="rc-group rc-size-group">
        <span class="rc-label">Arab matni:</span>
        <button class="rc-btn rc-size-btn" data-size="small">Kichik</button>
        <button class="rc-btn rc-size-btn rc-btn-active" data-size="medium">O'rta</button>
        <button class="rc-btn rc-size-btn" data-size="large">Katta</button>
      </div>

      <div class="rc-group rc-trans-group">
        <button class="rc-btn rc-trans-btn" id="toggleTranslation">Tarjimani yashirish</button>
      </div>

    </div>

    <div id="surahContent">
      <div class="state-msg">Yuklanmoqda...</div>
    </div>
  </main>

  <!-- ════════════════════════════════════════════════════════
       FIXED BOTTOM NAVIGATION BAR
       Independent navigation — does not relay to top bar.
       ════════════════════════════════════════════════════════ -->
  <nav id="ayah-bottom-nav" role="navigation" aria-label="Oyat navigatsiyasi">

    <button class="abn-btn abn-btn--prev" id="abn-prev" disabled aria-label="Oldingi oyat">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="10 3 6 8 10 13"/>
      </svg>
      ← Oldingi oyat
    </button>

    <span class="abn-counter" id="abn-counter" aria-live="polite">— / —</span>

    <button class="abn-btn abn-btn--next" id="abn-next" disabled aria-label="Keyingi oyat">
      Keyingi oyat →
      <svg viewBox="0 0 16 16" fill="none" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 3 10 8 6 13"/>
      </svg>
    </button>

  </nav>

  <!-- ── Quran reading logic (unchanged) ── -->
  <script src="/js/surah.js"></script>

  <!-- ── Bottom bar: own navigation, ripple, counter sync ── -->
  <script>
  (function () {
    'use strict';

    var prevBtn  = document.getElementById('abn-prev');
    var nextBtn  = document.getElementById('abn-next');
    var counter  = document.getElementById('abn-counter');

    var ayahEls  = [];
    var curIdx   = 0;
    var scrollTm = null;

    /* ── Ripple ─────────────────────────────────────── */
    function ripple(btn, evt) {
      var r    = btn.getBoundingClientRect();
      var d    = Math.max(r.width, r.height);
      var x    = (evt.clientX - r.left  - d / 2) + 'px';
      var y    = (evt.clientY - r.top   - d / 2) + 'px';
      var span = document.createElement('span');
      span.className = 'abn-ripple';
      span.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + x + ';top:' + y;
      btn.appendChild(span);
      span.addEventListener('animationend', function () { span.remove(); });
    }

    /* ── UI state ───────────────────────────────────── */
    function refresh() {
      prevBtn.disabled = curIdx <= 0;
      nextBtn.disabled = curIdx >= ayahEls.length - 1;
      counter.textContent = ayahEls.length
        ? (curIdx + 1) + ' / ' + ayahEls.length
        : '— / —';
    }

    /* ── Scroll to ayah ─────────────────────────────── */
    function goTo(idx) {
      if (idx < 0 || idx >= ayahEls.length) return;
      curIdx = idx;
      ayahEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
      refresh();
    }

    /* ── Detect nearest ayah while scrolling ────────── */
    function nearestIdx() {
      var mid  = window.innerHeight / 2;
      var best = 0, bestD = Infinity;
      ayahEls.forEach(function (el, i) {
        var r = el.getBoundingClientRect();
        var d = Math.abs((r.top + r.bottom) / 2 - mid);
        if (d < bestD) { bestD = d; best = i; }
      });
      return best;
    }

    /* ── Button clicks ──────────────────────────────── */
    prevBtn.addEventListener('click', function (e) {
      ripple(prevBtn, e);
      curIdx = nearestIdx();
      goTo(curIdx - 1);
    });

    nextBtn.addEventListener('click', function (e) {
      ripple(nextBtn, e);
      curIdx = nearestIdx();
      goTo(curIdx + 1);
    });

    /* ── Track scroll position ──────────────────────── */
    window.addEventListener('scroll', function () {
      clearTimeout(scrollTm);
      scrollTm = setTimeout(function () {
        if (!ayahEls.length) return;
        curIdx = nearestIdx();
        refresh();
      }, 120);
    }, { passive: true });

    /* ── Wait for surah.js to inject ayah blocks ────── */
    var contentEl = document.getElementById('surahContent');
    var observer  = new MutationObserver(function () {
      var blocks = contentEl.querySelectorAll('.ayah-block');
      if (blocks.length) {
        ayahEls = Array.from(blocks);
        curIdx  = 0;
        /* honour ?ayah= param */
        var params = new URLSearchParams(window.location.search);
        var target = Number(params.get('ayah'));
        if (target) {
          var tIdx = ayahEls.findIndex(function (el) {
            return el.id === 'ayah-' + target;
          });
          if (tIdx !== -1) curIdx = tIdx;
        }
        refresh();
        observer.disconnect();
      }
    });
    observer.observe(contentEl, { childList: true, subtree: true });

  })();
  </script>

</body>
</html>

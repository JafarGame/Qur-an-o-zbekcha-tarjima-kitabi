<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LA ILAHA ILLALLAH ning shartlari | Din Asillari</title>
<meta name="description" content="LA ILAHA ILLALLAH ning 8 ta sharti — to'liq tushuncha, arabcha matn va o'zbekcha sharh bilan." />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<script>if(localStorage.getItem("darkMode")==="true")document.documentElement.classList.add("dark");</script>

<style>
body { padding-bottom: 40px; }

/* ── Reading controls ── */
.reading-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  align-items: center;
  background: var(--color-bg-alt);
  border: 1px solid var(--color-border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.rc-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.rc-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--color-muted);
  white-space: nowrap;
}

.rc-btn {
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 5px 13px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-muted);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  white-space: nowrap;
}

.rc-btn:hover { background: rgba(15,81,50,0.07); color: var(--color-primary-dark); }

.rc-btn-active {
  background: var(--color-primary);
  color: #fdfaf0;
  border-color: var(--color-primary);
}

.rc-btn-active:hover { background: var(--color-primary-dark); }

/* ── Intro banner ── */
.kalima-banner {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  border-radius: var(--radius);
  padding: 22px 20px;
  text-align: center;
  margin-bottom: 22px;
  box-shadow: var(--shadow);
}

.kalima-banner-arabic {
  font-family: "Amiri Quran", "Amiri", serif;
  font-size: 1.7rem;
  color: #fdfaf0;
  line-height: 2.2;
  direction: rtl;
  display: block;
  margin-bottom: 8px;
  text-shadow: 0 1px 8px rgba(0,0,0,0.3);
}

.kalima-banner-latin {
  font-size: 0.88rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: rgba(212, 175, 83, 0.95);
}

/* ── Action toast ── */
.action-toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  background: rgba(22, 60, 35, 0.92);
  color: #fdfaf0;
  padding: 10px 22px;
  border-radius: 999px;
  border: 1px solid rgba(212, 175, 83, 0.4);
  font-family: "Poppins", sans-serif;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 4px 20px rgba(0,0,0,0.28);
}
.action-toast.act-visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
html.dark .action-toast {
  background: rgba(10, 38, 22, 0.94);
  border-color: rgba(212, 175, 83, 0.35);
}

/* ── ayah-actions (buttons row) ── */
.ayah-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--color-border);
}

.ayah-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid var(--color-border);
  background: transparent;
  color: var(--color-muted);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.ayah-action-btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.ayah-action-btn:hover {
  background: rgba(15,81,50,0.08);
  color: var(--color-primary-dark);
  border-color: rgba(15,81,50,0.25);
}

.ayah-action-btn:active { transform: scale(0.95); }

html.dark .ayah-action-btn:hover {
  background: rgba(255,255,255,0.07);
  color: #c8d4c0;
  border-color: rgba(255,255,255,0.12);
}

/* ── Shart number badge — matching diamond style ── */
.shart-badge-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.shart-badge {
  flex-shrink: 0;
  padding: 3px 13px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: #fdfaf0;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  box-shadow: 0 2px 6px rgba(15,81,50,0.25);
  white-space: nowrap;
}

.shart-name {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--color-gold);
  letter-spacing: 0.05em;
}
</style>
</head>
<body>

  <header class="site-header">
    <a class="back-link" href="/din-asillari.html">← Din Asillari</a>
    <h1>LA ILAHA ILLALLAH</h1>
  </header>

  <main class="container">

    <!-- Kalima banner -->
    <div class="kalima-banner">
      <span class="kalima-banner-arabic">لَا إِلَٰهَ إِلَّا اللَّهُ</span>
      <div class="kalima-banner-latin">LA ILAHA ILLALLAH — ning 8 ta sharti</div>
    </div>

    <!-- Reading controls -->
    <div class="reading-controls">
      <div class="rc-group">
        <span class="rc-label">Arab matni:</span>
        <button class="rc-btn rc-size-btn" data-size="small">Kichik</button>
        <button class="rc-btn rc-size-btn rc-btn-active" data-size="medium">O'rta</button>
        <button class="rc-btn rc-size-btn" data-size="large">Katta</button>
      </div>
      <div class="rc-group">
        <button class="rc-btn" id="toggleTranslation">Tarjimani yashirish</button>
      </div>
    </div>

    <div id="dinContent"></div>

  </main>

  <script src="/js/lang.js"></script>
  <script src="/js/clipboard.js"></script>

  <script>
  (function () {
    'use strict';

    // ── Content data ─────────────────────────────────────────────
    var ENTRIES = [
      {
        num: 1,
        shart: '1-SHART',
        name: 'AL-\'ILM — BILIM',
        arabic: 'الشَّرْطُ الْأَوَّلُ: الْعِلْمُ',
        uzbek: 'Kalimaning ma\'nosini to\'g\'ri bilish: ya\'ni ALLAHdan o\'zgaga ibodatning batilligini va faqat ALLAHga ibodatning vojibligini ilm bilan tushunish. ALLAH taolo aytadi: "Bil! Albatta, ALLAHdan o\'zgasi ibodatga loyiq emas" (Muhammad 47:19). Nodonlik bu shartni buzadi.'
      },
      {
        num: 2,
        shart: '2-SHART',
        name: 'AL-YAQIN — YAQINLIK',
        arabic: 'الشَّرْطُ الثَّانِي: الْيَقِينُ',
        uzbek: 'Bu kalimaning ma\'nosiga qalban to\'liq va shubhasiz ishonch. Hech qanday ikkilanishsiz, mustahkam yaqin bilan iymon keltirish. Payg\'ambar ﷺ aytdilar: "Men guvohlik beramanki, ALLAHdan boshqa ma\'bud yo\'q — bundan hech shak yo\'q, degan holda ALLAH bilan uchrashgan kishi, u jannatga kiradi." (Buxoriy). Shak-shubha bu shartni buzadi.'
      },
      {
        num: 3,
        shart: '3-SHART',
        name: 'AL-QABUL — QABUL QILISH',
        arabic: 'الشَّرْطُ الثَّالِثُ: الْقَبُولُ',
        uzbek: 'Bu kalimaning ma\'nosini va uning talab qilgan narsasini — faqat ALLAHga ibodat qilishni va boshqalarga ibodat qilishdan yuz o\'girish — qalb va til bilan qabul qilish. ALLAH taolo aytadi: "Ular: «Bizning xudolarimizni tashlab, bir shoirning so\'ziga bo\'ysunarmidik?» — dedilar" (As-Soffot, 37:36). Kibr yoki istehzo bilan rad etish bu shartni buzadi.'
      },
      {
        num: 4,
        shart: '4-SHART',
        name: 'AL-INQIYOD — ITOAT',
        arabic: 'الشَّرْطُ الرَّابِعُ: الِانْقِيَادُ',
        uzbek: 'Bu kalimaning talablariga — faqat ALLAHga ibodat qilish va qolgan narsadan yuz o\'girishga — tashqi a\'zolar bilan bo\'ysunib amal qilish. ALLAH taolo aytadi: "Kim o\'zini to\'liq ALLAHga topshirsa va u yaxshilik qiluvchi bo\'lsa, u chin ma\'noda mustahkam dastakdan ushlabdi" (Luqmon, 31:22). Faqat til bilan tan olish, a\'zolar bilan amal qilmaslik yetarli emas.'
      },
      {
        num: 5,
        shart: '5-SHART',
        name: 'AS-SIDQ — SAMIMIYLIK',
        arabic: 'الشَّرْطُ الْخَامِسُ: الصِّدْقُ',
        uzbek: 'Bu kalimani qalb to\'liq tasdiqlagan holda, samimiyan aytish. Munofiklar esa uni til bilan aytib, qalb bilan inkor qilganlar — ALLAH taolo ular haqida aytadi: "Ular og\'iz bilan «Iymon keltirdik» — deydilar, ammo qalblari iymon keltirmagan" (Al-Moida, 5:41). Qalb tilga zid bo\'lishi bu shartni buzadi.'
      },
      {
        num: 6,
        shart: '6-SHART',
        name: 'AL-IKHLOS — IKHLOS',
        arabic: 'الشَّرْطُ السَّادِسُ: الْإِخْلَاصُ',
        uzbek: 'Bu kalimani faqat ALLAH rizoyi uchun aytish, unda hech qanday riyodan, shirk va ko\'z-ko\'z qilishdan xoli bo\'lish. Payg\'ambar ﷺ aytdilar: "Qaysi biri ikhlos bilan «LA ILAHA ILLALLAH» desa — ALLAH uni jahannamga harom qilur." (Buxoriy). Riyokor niyat bu shartni buzadi.'
      },
      {
        num: 7,
        shart: '7-SHART',
        name: 'AL-MAHABBAH — SEVGI',
        arabic: 'الشَّرْطُ السَّابِعُ: الْمَحَبَّةُ',
        uzbek: 'Bu kalimani, uning ma\'nosini, ahlini va uning talab qilganlarini sevish. ALLAHni va Uning payg\'ambarini ﷺ hamma narsadan — ota-ona va farzandlardan ham — ortiq sevish. ALLAH taolo aytadi: "Iymon keltirganlar ALLAHga muhabbatda eng kuchliroqdirlar" (Al-Baqara, 2:165). Bu karimaning dushmanlarini yoqtirmaslik ham shu shartga kiradi.'
      },
      {
        num: 8,
        shart: '8-SHART',
        name: 'AL-KUFR BIT-TOGHUT — BOTIL ILOHLARGA KUFR',
        arabic: 'الشَّرْطُ الثَّامِنُ: الْكُفْرُ بِالطَّاغُوتِ',
        uzbek: 'Botil ilohlarni inkor qilish (الكفر بالطاغوت) — ALLAHdan o\'zgaga ibodat qilinadigan barcha narsalarni (toghutlarni) inkor etish, ulardan yuz o\'girish va ularni haqiqiy ma\'bud deb tan olishni rad qilish. ALLAH taolo aytadi: "Kim toghutni inkor etib, ALLAHga iymon keltirsa, u hech qachon uzilib ketmaydigan mustahkam dastakdan ushlabdi" (Al-Baqara, 2:256). Kalima "LA ILAHA" — inkor bilan boshlanadi: avval barcha botil ilohlarga kufr, so\'ng "ILLALLAH" — faqat ALLAHga iqror. Bu shart — kalimaning birinchi yarmining talab qilgan narsasidir.'
      }
    ];

    // ── SVG icons ─────────────────────────────────────────────────
    var ICON_COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2H3.5A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>';
    var ICON_SHARE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v9M5 5l3-3 3 3"/><path d="M3 10v3a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-3"/></svg>';

    // ── Toast ─────────────────────────────────────────────────────
    var toast = document.createElement('div');
    toast.className = 'action-toast';
    document.body.appendChild(toast);
    var toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('act-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('act-visible'); }, 1800);
    }

    // ── Arabic size ───────────────────────────────────────────────
    var VALID_SIZES = ['small', 'medium', 'large'];
    var SIZE_KEY    = 'quran_arabic_size';
    var stored      = localStorage.getItem(SIZE_KEY);
    var currentSize = VALID_SIZES.includes(stored) ? stored : 'medium';

    function applySize(size) {
      VALID_SIZES.forEach(function (s) { document.body.classList.remove('arabic-size-' + s); });
      document.body.classList.add('arabic-size-' + size);
      currentSize = size;
      localStorage.setItem(SIZE_KEY, size);
      document.querySelectorAll('.rc-size-btn').forEach(function (btn) {
        btn.classList.toggle('rc-btn-active', btn.dataset.size === size);
      });
    }
    applySize(currentSize);

    // ── Translation toggle ────────────────────────────────────────
    var TRANS_KEY = 'quran_show_translation';
    var showTrans = localStorage.getItem(TRANS_KEY) !== 'false';
    var toggleBtn = document.getElementById('toggleTranslation');

    function applyTrans(show) {
      showTrans = show;
      localStorage.setItem(TRANS_KEY, show ? 'true' : 'false');
      document.body.classList.toggle('translations-hidden', !show);
      if (toggleBtn) toggleBtn.textContent = show ? 'Tarjimani yashirish' : 'Tarjimani ko\'rsatish';
    }
    applyTrans(showTrans);

    document.querySelectorAll('.rc-size-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { applySize(btn.dataset.size); });
    });
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function () { applyTrans(!showTrans); });
    }

    // ── Render entries ────────────────────────────────────────────
    var contentEl = document.getElementById('dinContent');

    var html = ENTRIES.map(function (e) {
      return '<div class="ayah-block" id="entry-' + e.num + '">' +
               '<div class="shart-badge-row">' +
                 '<span class="shart-badge">' + e.shart + '</span>' +
                 '<span class="shart-name">' + e.name + '</span>' +
               '</div>' +
               '<div class="ayah-arabic">' + e.arabic + '</div>' +
               '<div class="ayah-translation">' +
                 '<span class="label">O\'ZBEKCHA</span>' +
                 '<p>' + escHtml(e.uzbek) + '</p>' +
               '</div>' +
               '<div class="ayah-actions">' +
                 '<button class="ayah-action-btn" data-action="copy" data-idx="' + (e.num - 1) + '">' +
                   ICON_COPY + '<span>Nusxa</span>' +
                 '</button>' +
                 '<button class="ayah-action-btn" data-action="share" data-idx="' + (e.num - 1) + '">' +
                   ICON_SHARE + '<span>Ulashish</span>' +
                 '</button>' +
               '</div>' +
             '</div>';
    }).join('');

    contentEl.innerHTML = html;

    // ── Action delegation ─────────────────────────────────────────
    contentEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.ayah-action-btn');
      if (!btn) return;
      var idx    = Number(btn.dataset.idx);
      var entry  = ENTRIES[idx];
      var action = btn.dataset.action;

      if (action === 'copy') {
        var text = entry.arabic + '\n\n' + entry.name + '\n' + entry.uzbek +
                   '\n\n— Din Asillari | LA ILAHA ILLALLAH ning shartlari';
        ClipboardUtils.copy(text)
          .then(function ()  { showToast('Nusxa olindi ✓'); })
          .catch(function () { showToast('Xatolik yuz berdi'); });
      }

      if (action === 'share') {
        var shareData = {
          title: 'LA ILAHA ILLALLAH — ' + entry.shart,
          text:  entry.arabic + '\n\n' + entry.name + '\n' + entry.uzbek +
                 '\n\n— Din Asillari | LA ILAHA ILLALLAH ning shartlari'
        };
        ClipboardUtils.share(shareData, function () { showToast('Matn nusxa olindi ✓'); })
          .catch(function () { showToast('Ulashishda xatolik'); });
      }
    });

    function escHtml(s) {
      return s.replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;');
    }

    // ── Apply Cyrillic labels if needed ──────────────────────────
    if (window.Lang && Lang.isKiril()) {
      var bl = document.querySelector('.back-link');
      if (bl) bl.textContent = '← Дин Асиллари';
      document.title = 'LA ILAHA ILLALLAH нинг шартлари | Дин Асиллари';
      var banner = document.querySelector('.kalima-banner-latin');
      if (banner) banner.textContent = 'LA ILAHA ILLALLAH — нинг 7 та шарти';
      if (toggleBtn) toggleBtn.textContent = showTrans ? 'Таржимани яшириш' : 'Таржимани кўрсатиш';
      document.querySelectorAll('.rc-size-btn').forEach(function (b) {
        var map = { small: 'Кичик', medium: 'Ўрта', large: 'Катта' };
        b.textContent = map[b.dataset.size] || b.textContent;
      });
      document.querySelector('.rc-label').textContent = 'Араб матни:';
      document.querySelectorAll('.ayah-action-btn').forEach(function (b) {
        var s = b.querySelector('span');
        if (!s) return;
        if (b.dataset.action === 'copy')  s.textContent = 'Нусха';
        if (b.dataset.action === 'share') s.textContent = 'Улашиш';
      });
    }

  })();
  </script>

</body>
</html>
